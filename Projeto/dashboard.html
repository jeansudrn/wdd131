<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grana Cash - Painel</title>
    <meta name="description" content="Página informativa sobre a Amazônia brasileira com dados gerais e clima local.">
    <meta name="author" content="Jean Carlos Jeronimo do Amaral Leal">
    <link rel="stylesheet" href="estilos/base.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">Grana<span>Cash</span></a>
            <button class="menu-toggle" id="menu-btn">☰</button>
            <ul class="nav-menu" id="nav-list">
                <li><a href="index.html">Início</a></li>
                <li><a href="dashboard.html" class="active">Painel</a></li>
                <li><a href="sobre.html">Sobre</a></li>
            </ul>
        </div>
    </nav>

    <main class="container dashboard-main">
        <!-- Cartões de Resumo -->
        <section class="cards-summary">
            <div class="card card-income">
                <h3>Entradas</h3>
                <p id="total-income">R$ 0,00</p>
            </div>
            <div class="card card-expense">
                <h3>Saídas</h3>
                <p id="total-expense">R$ 0,00</p>
            </div>
            <div class="card card-balance">
                <h3>Saldo Atual</h3>
                <p id="total-balance">R$ 0,00</p>
            </div>
        </section>

        <!-- Área do Formulário Padrão -->
        <section class="form-section">
            <h2>Nova Movimentação</h2>
            <form id="finance-form">
                <div class="input-group">
                    <label for="description">Descrição</label>
                    <input type="text" id="description" required placeholder="Ex: Salário, Almoço, Luz">
                </div>
                <div class="input-group">
                    <label for="amount">Valor (R$)</label>
                    <input type="number" id="amount" step="0.01" required placeholder="0.00">
                </div>
                <div class="input-group">
                    <label for="type">Tipo</label>
                    <select id="type" required>
                        <option value="">Selecione...</option>
                        <option value="income">Entrada (Ganho)</option>
                        <option value="expense">Saída (Gasto)</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Salvar Registro</button>
            </form>
        </section>

        <!-- Tabela Dinâmica de Registros -->
        <section class="table-section">
            <h2>Histórico de Transações</h2>
            <div class="table-responsive">
                <table id="transactions-table">
                    <thead>
                        <tr>
                            <th>Descrição</th>
                            <th>Valor</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Inserido dinamicamente via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Grana Cash - Ferramenta Gratuita de Organização Financeira.</p>
    </footer>

    <script src="scripts/base.js"></script>
</body>
</html>
